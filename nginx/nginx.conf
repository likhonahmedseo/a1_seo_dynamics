# ─────────────────────────────────────────────────────────────────────────────
# Nginx reverse proxy for A1 Mail Dynamics (production)
#
# Usage:
#   docker compose --profile nginx up -d
#
# TLS:
#   Place your certificate at  nginx/ssl/cert.pem
#   and your private key at    nginx/ssl/key.pem
#   then uncomment the HTTPS server block below.
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    keepalive_timeout  65;
    client_max_body_size 30M;

    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/wasm;
    gzip_min_length   1000;

    # ── Upstream ──────────────────────────────────────────────────────────────
    upstream a1app {
        server app:5000;
        keepalive 16;
    }

    # ── HTTP (redirect to HTTPS in production, or serve directly for LAN) ─────
    server {
        listen 80;
        server_name _;

        # Health check — bypass auth so load balancers can probe it
        location = /api/health {
            proxy_pass http://a1app;
            proxy_set_header Host $host;
            access_log off;
        }

        # SSE streams: disable buffering so events reach the browser in real-time
        location ~* ^/api/(generate-ai|send-gmail|send-smtp-throttled) {
            proxy_pass         http://a1app;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection "";
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass         http://a1app;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection "";
            proxy_read_timeout 120s;
        }
    }

    # ── HTTPS (uncomment and fill in your domain / cert paths) ────────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    #     add_header X-Content-Type-Options nosniff always;
    #     add_header X-Frame-Options DENY always;
