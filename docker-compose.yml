# ─────────────────────────────────────────────────────────────────────────────
# A1 Mail Dynamics — Docker Compose (production)
#
# Quick start:
#   1. cp .env.example .env  &&  nano .env   # fill in your keys / SMTP
#   2. docker compose up -d
#   3. Open http://localhost:5000  (or http://localhost if using the nginx profile)
#
# With nginx reverse proxy (recommended for internet-facing deployments):
#   docker compose --profile nginx up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: a1maildynamics:latest
    container_name: a1maildynamics
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: "5000"
      WAITRESS_THREADS: "8"
    ports:
      - "5000:5000"
    volumes:
      # Persist user data and logs outside the container
      - a1_data:/app/data
      - a1_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: a1maildynamics_nginx
    restart: unless-stopped
    profiles:
      - nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro       # mount your TLS cert/key here
    depends_on:
      app:
        condition: service_healthy

volumes:
  a1_data:
  a1_logs:
